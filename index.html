<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Maze</title>
  <link rel="icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ── Top navigation bar ─────────────────────────────────────── -->
  <header class="site-header">
    <div class="site-title">
      <span class="title-icon" aria-hidden="true">⬡</span>
      <h1>Open Maze</h1>
    </div>
    <nav class="site-nav" aria-label="Main navigation">
      <button id="nav-tutorial" class="nav-btn nav-btn--highlight">Tutorial</button>
      <button id="nav-mazes"    class="nav-btn">Other Mazes</button>
      <button id="nav-creator"  class="nav-btn">Maze Creator</button>
      <button id="nav-ends"     class="nav-btn nav-btn--icon" title="Highlight start &amp; end markers">⊙</button>
      <button id="nav-zoom"     class="nav-btn nav-btn--icon" title="Zoom in / out">⊕</button>
    </nav>
  </header>

  <!-- ── Context action bar ─────────────────────────────────────── -->
  <div class="action-bar-wrap" role="toolbar" aria-label="Game controls">
    <div id="action-bar" class="action-bar"></div>
    <div id="key-hints"  class="key-hints"  aria-label="Keyboard shortcuts"></div>
  </div>

  <!-- ── Main content: canvas + optional tutorial panel ────────── -->
  <main class="maze-wrap">
    <div class="canvas-scroll">
      <canvas id="canvas" tabindex="0" aria-label="Maze canvas"></canvas>
    </div>
    <aside id="tutorial-panel" class="tutorial-panel" hidden aria-label="Tutorial"></aside>
  </main>

  <!-- ── Footer ─────────────────────────────────────────────────── -->
  <footer class="site-footer">
    <a href="https://kevindprice.github.io" target="_blank" rel="noopener">
      Kevin Price's Homepage
    </a>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
